<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add a Character - DC Character Gallery</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand" href="index.html">DC Gallery</a>

            <div class="navbar-nav">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="details.html">Details</a>
                <a class="nav-link" href="about.html">About</a>
                <a class="nav-link active" href="new-character-form.html">Add a Character</a>
            </div>

        </div>
    </nav>

    <div class="container py-5">

        <h1 class="mb-4">Add a New Character</h1>

        <p>
            Fill out the form below to add a new character to the DC gallery.
        </p>

        <form>

            <div class="mb-3">
                <label for="name" class="form-label">
                    Character Name:
                </label>

                <input type="text"
                       id="name"
                       name="name"
                       class="form-control">
            </div>

            <div class="mb-3">
                <label for="universe" class="form-label">
                    Universe:
                </label>

                <input type="text"
                       id="universe"
                       name="universe"
                       class="form-control">
            </div>

            <div class="mb-3">
                <label for="role" class="form-label">
                    Role:
                </label>

                <input type="text"
                       id="role"
                       name="role"
                       class="form-control">
            </div>

            <div class="mb-3">
                <label for="image" class="form-label">
                    Image URL:
                </label>

                <input type="text"
                       id="image"
                       name="image"
                       class="form-control">
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">
                    Short Description:
                </label>

                <textarea id="description"
                          name="description"
                          class="form-control"
                          rows="4"></textarea>
            </div>

            <button class="btn btn-primary">
                Add Character
            </button>

        </form>

    </div>

    <footer class="bg-light text-center py-3 mt-5">
        <p class="text-muted mb-0">
            DC Character Gallery
        </p>
    </footer>

</body>

</html>
